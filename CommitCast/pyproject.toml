[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitcast"
version = "1.2.1"
description = "Complete-horizon forecast commitment and causal online revision"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "PyYAML==6.0.3", "torch==2.10.0", "yacs==0.1.8"
]

[project.optional-dependencies]
baselines = [
  "scipy==1.17.1", "scikit-learn==1.8.0", "einops==0.8.1", "reformer-pytorch==1.4.4",
  "matplotlib>=3.8", "tqdm>=4.64", "wandb>=0.16", "fvcore>=0.1.5", "iopath>=0.1.9"
]
dev = ["pytest>=7"]

[project.scripts]
commitcast = "main:main"
commitcast-baseline = "scripts.run_baseline:main"
commitcast-schedules = "scripts.run_schedules:main"

[tool.setuptools]
packages = ["datasets", "fcr", "layers", "models", "tta", "utils", "scripts", "baselines", "configs"]
py-modules = ["config", "main", "predictor", "trainer"]

[tool.setuptools.package-data]
baselines = ["sources/*.zip", "SOURCES.json", "README.md"]
configs = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
