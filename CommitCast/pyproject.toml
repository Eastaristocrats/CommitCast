[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitcast"
version = "1.3.1"
description = "Complete-horizon forecast commitment and causal online revision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "PyYAML==6.0.3", "torch==2.10.0", "yacs==0.1.8"
]

[project.optional-dependencies]
baselines = [
  "scipy==1.17.1", "scikit-learn==1.8.0", "einops==0.8.1", "reformer-pytorch==1.4.4",
  "matplotlib>=3.8", "tqdm>=4.64", "wandb>=0.16", "fvcore>=0.1.5", "iopath>=0.1.9"
]

[project.scripts]
commitcast = "main:main"
commitcast-baseline = "scripts.run_baseline:main"
commitcast-schedules = "scripts.run_schedules:main"

[tool.setuptools]
py-modules = ["config", "main", "predictor", "trainer"]
include-package-data = false
license-files = ["LICENSE", "licenses/*", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["datasets*", "fcr*", "layers*", "models*", "tta*", "utils*", "scripts*", "configs*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.sh", "*.ps1", "*.yaml", "*.yml", "README.md", "LICENSE", ".gitignore"]
configs = ["*.yaml", "published.json"]
